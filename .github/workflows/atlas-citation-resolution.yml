name: Atlas citation resolution
on:
  push:
    branches:
      - frontier/atlas-citation-resolution-20261126
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify imported citation overlay (stdlib only)
        run: python -B research/frontier/atlas_citation_resolution_20261126/verify.py

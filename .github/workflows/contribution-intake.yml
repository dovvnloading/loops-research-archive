name: Contribution intake

# One workflow for every contributed packet under contributions/. It checks the
# packet's shape, that the status record is untouched, and runs the packet's own
# check_*.py / verify_*.py. Contributors add no workflow file of their own.
# AGENTS.md describes the process; `python code/contribute.py check` is the
# same check, locally.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - ledger.json
      - OPEN_TARGETS.md
      - results/open_targets.json
      - code/contribute.py
      - code/test_contribute.py
      - 'contributions/**'
      - .github/workflows/contribution-intake.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the intake tooling
        run: python -B code/test_contribute.py

      - name: Open-target list matches the ledger
        run: python -B code/contribute.py targets --check

      # The rules come from the base branch, so a pull request cannot relax the
      # checks that judge it. The first run, before the file exists there, uses
      # the pull request's own copy.
      - name: Take the checker from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:code/contribute.py" > "$RUNNER_TEMP/contribute.py" 2>/dev/null; then
            echo "Using code/contribute.py from ${BASE_REF}."
          else
            cp code/contribute.py "$RUNNER_TEMP/contribute.py"
            echo "Base branch has no checker yet; using this pull request's copy."
          fi

      - name: Install the libraries packet scripts may use
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^contributions/[^/]+/.*\.py$'; then
            python -m pip install --quiet -r requirements.txt
          else
            echo "No packet script in this pull request."
          fi

      - name: Check the contribution
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          CONTRIBUTE_PR_TITLE: ${{ github.event.pull_request.title }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$IS_DRAFT" = "true" ]; then mode="--draft"; else mode=""; fi
          python -B "$RUNNER_TEMP/contribute.py" --root "$GITHUB_WORKSPACE" check --base "origin/${BASE_REF}" $mode

name: CS growth hypothesis audit
on:
  push:
    branches: [frontier/cs-growth-hypothesis-20261126]
  pull_request:
    paths:
      - 'research/frontier/cs_growth_hypothesis_20261126/**'
      - '.github/workflows/cs-growth-hypothesis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'frontier/cs-growth-hypothesis-20261126'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify exact arithmetic
        run: python3 -B research/frontier/cs_growth_hypothesis_20261126/verify.py
      - name: Retrieve and commit source hashes on audit branch only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/frontier/cs-growth-hypothesis-20261126'
        shell: bash
        run: |
          set -euo pipefail
          d=research/frontier/cs_growth_hypothesis_20261126
          if [ ! -f "$d/sources.lock.json" ] || [ ! -f "$d/arithmetic.json" ]; then
            python3 -B "$d/verify.py" --lock
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$d/sources.lock.json" "$d/arithmetic.json"
            if ! git diff --cached --quiet; then
              git commit -m 'Record CS growth audit exact arithmetic and PDF fingerprints'
              git push origin HEAD:refs/heads/frontier/cs-growth-hypothesis-20261126
            fi
          fi
      - name: Check committed provenance and arithmetic
        run: python3 -B research/frontier/cs_growth_hypothesis_20261126/verify.py --check-lock

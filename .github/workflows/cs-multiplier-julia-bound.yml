name: Satellite attachment Julia bounds
on:
  pull_request:
    paths:
      - 'research/frontier/cs_multiplier_julia_bound_20261126/**'
      - 'research/frontier/cs_multiplier_locus_extended_20261126/results.json'
      - 'formalization/physical_bridge_sources.tsv'
      - '.github/workflows/cs-multiplier-julia-bound.yml'
  push:
    branches: [main, research/cs-multiplier-julia-bound-20261126]
    paths:
      - 'research/frontier/cs_multiplier_julia_bound_20261126/**'
      - 'formalization/physical_bridge_sources.tsv'
      - '.github/workflows/cs-multiplier-julia-bound.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run exact rational regression
        run: node research/frontier/cs_multiplier_julia_bound_20261126/verify.mjs
      - name: Check source registration
        run: python3 -B code/verify_physical_bridges.py

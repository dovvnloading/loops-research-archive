name: CS extended actual multiplier locus
on:
  push:
    branches: [frontier/cs-multiplier-locus-extended-20261126]
    paths:
      - 'research/frontier/cs_multiplier_locus_extended_20261126/**'
      - 'formalization/physical_bridge_sources.tsv'
  pull_request:
    paths:
      - 'research/frontier/cs_multiplier_locus_extended_20261126/**'
      - '.github/workflows/cs-multiplier-locus-extended.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'frontier/cs-multiplier-locus-extended-20261126'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned numerical dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: mpmath==1.3.0
      - name: Build numerical accelerator and record environment
        shell: bash
        run: |
          set -euo pipefail
          python --version
          g++ --version
          dpkg-query -W libgmp-dev
          d=research/frontier/cs_multiplier_locus_extended_20261126
          python -B "$d/fast_source.py" /tmp/cs-jet.so
      - name: Reproduce linked levels at two precisions
        shell: bash
        run: |
          set -euo pipefail
          d=research/frontier/cs_multiplier_locus_extended_20261126
          python -B "$d/extend.py" --fast /tmp/cs-jet.so --dps 50 --steps 8 --max-q 9 --output /tmp/cs-low.json
          python -B "$d/extend.py" --fast /tmp/cs-jet.so --dps 80 --steps 16 --max-q 9 --output /tmp/cs-high.json
      - name: Regenerate nested radial grids, including ancestor observations
        shell: bash
        run: |
          set -euo pipefail
          d=research/frontier/cs_multiplier_locus_extended_20261126
          python -B "$d/extend.py" --fast /tmp/cs-jet.so --dense-from /tmp/cs-low.json --max-q 7 --grid 128 --steps 8 --output /tmp/cs-dense7.json
          python -B "$d/extend.py" --fast /tmp/cs-jet.so --dense-from /tmp/cs-high.json --min-q 8 --max-q 8 --grid 64 --steps 8 --output /tmp/cs-dense8.json
      - name: Independently certify candidate disks and compare committed results
        shell: bash
        run: |
          set -euo pipefail
          d=research/frontier/cs_multiplier_locus_extended_20261126
          python -B "$d/chart_inputs.py" /tmp/cs-high.json /tmp/cs-inputs.json --fast /tmp/cs-jet.so
          python -B "$d/certify.py" /tmp/cs-inputs.json /tmp/cs-certs.json
          python -B "$d/summarize.py" /tmp/cs-low.json /tmp/cs-high.json /tmp/cs-dense7.json /tmp/cs-dense8.json /tmp/cs-inputs.json /tmp/cs-certs.json /tmp/cs-summary.json
          python -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))' "$d/results.json" /tmp/cs-summary.json
          # Use the checked-out repository for tracked-source validation in the container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -B code/verify_physical_bridges.py
      - name: Preserve full observations and integer disk certificates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs-multiplier-locus-extended-raw
          path: |
            /tmp/cs-low.json
            /tmp/cs-high.json
            /tmp/cs-dense7.json
            /tmp/cs-dense8.json
            /tmp/cs-inputs.json
            /tmp/cs-certs.json
            /tmp/cs-summary.json
          if-no-files-found: error

name: CS actual multiplier locus numerics
on:
  push:
    branches: [frontier/cs-multiplier-locus-numerics-20261126]
  pull_request:
    paths:
      - 'research/frontier/cs_multiplier_locus_numerics_20261126/**'
      - '.github/workflows/cs-multiplier-locus-numerics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'frontier/cs-multiplier-locus-numerics-20261126'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: mpmath==1.3.0
      - name: Regenerate at both precisions and check committed summary
        shell: bash
        run: |
          set -euo pipefail
          d=research/frontier/cs_multiplier_locus_numerics_20261126
          python -B "$d/measure.py" --output "$RUNNER_TEMP/cs-locus-raw.json"
          python -B "$d/summarize.py" "$RUNNER_TEMP/cs-locus-raw.json" "$RUNNER_TEMP/cs-locus-summary.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))' "$d/summary.json" "$RUNNER_TEMP/cs-locus-summary.json"
          python -B code/verify_physical_bridges.py
      - name: Preserve full regenerated observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cs-multiplier-locus-raw
          path: |
            ${{ runner.temp }}/cs-locus-raw.json
            ${{ runner.temp }}/cs-locus-summary.json
          if-no-files-found: error

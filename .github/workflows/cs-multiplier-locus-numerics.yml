name: CS actual multiplier locus numerics
"on":
  push:
    branches: [main, frontier/cs-multiplier-locus-numerics-20261126]
    paths:
      - 'research/frontier/cs_multiplier_locus_numerics_20261126/**'
      - '.github/workflows/cs-multiplier-locus-numerics.yml'
  pull_request:
    paths:
      - 'research/frontier/cs_multiplier_locus_numerics_20261126/**'
      - '.github/workflows/cs-multiplier-locus-numerics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cs-locus-verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'frontier/cs-multiplier-locus-numerics-20261126'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: mpmath==1.3.0
      - name: Regenerate at both precisions and check committed summary
        shell: bash
        run: |
          set -euo pipefail
          d=research/frontier/cs_multiplier_locus_numerics_20261126
          python -B "$d/measure.py" --output "$RUNNER_TEMP/cs-locus-raw.json"
          python -B "$d/summarize.py" "$RUNNER_TEMP/cs-locus-raw.json" "$RUNNER_TEMP/cs-locus-summary.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))' "$d/summary.json" "$RUNNER_TEMP/cs-locus-summary.json"
          python -B code/verify_physical_bridges.py
      - name: Check reported raw diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/cs-locus-raw.json" <<'PY'
          import json, sys
          import mpmath as m
          m.mp.dps = 80
          data = json.load(open(sys.argv[1]))
          for name, qs in (("linear",[3,4,5,6,7]),("bounded",[3]*5),("square",[3,9,81])):
              a = data[name]
              for tag, rows in (("low",a["low_levels"]),("high",a["levels"])):
                  assert [r["q"] for r in rows] == qs
                  samples = [s for r in rows for s in r["samples"]]
                  assert len(samples) == 3*len(qs)*(len(qs)+1)
                  assert all(s["ply_integer_shifts"] == [0] for s in samples)
                  assert all(r["seed_factor"] == "1" for r in rows)
                  assert all(r["max_sample"] == f'minusI-{r["i"]}' for r in rows)
                  assert all(m.mpf(r["root_gap"]) > 0 and m.mpf(r["center_gap"]) > 0 for r in rows)
                  assert all(m.mpf(r["attachment_ratios"][1]) < m.mpf("0.0002") and m.mpf(r["attachment_ratios"][1])/m.mpf(r["attachment_ratios"][0]) < m.mpf("0.02") for r in rows)
                  print(name, tag, "min dividing gap", min(m.mpf(s["primitive_gap"]) for s in samples), "max disk excess", max(m.mpf(s["disk_excess"]) for s in samples), "max final attachment ratio", max(m.mpf(r["attachment_ratios"][1]) for r in rows))
              print(name, "stored L precision equality", [r["L"] for r in a["levels"]] == [r["L"] for r in a["low_levels"]], "fit precision equality", a["fit_S"] == a["low_fit_S"] and a["fit_q"] == a["low_fit_q"])
          PY
      - name: Preserve full regenerated observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs-multiplier-locus-raw
          path: |
            ${{ runner.temp }}/cs-locus-raw.json
            ${{ runner.temp }}/cs-locus-summary.json
          if-no-files-found: error

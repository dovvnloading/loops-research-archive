name: CS Proposition 6.10 angular audit
on:
  push:
    branches: [frontier/cs-prop-6-10-angular-20261126]
    paths:
      - 'research/frontier/cs_prop_6_10_angular_20261126/**'
      - '.github/workflows/cs-prop-6-10-angular.yml'
  pull_request:
    paths:
      - 'research/frontier/cs_prop_6_10_angular_20261126/**'
      - '.github/workflows/cs-prop-6-10-angular.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'frontier/cs-prop-6-10-angular-20261126'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact scalar diagnostics
        run: python3 -B research/frontier/cs_prop_6_10_angular_20261126/verify.py
      - name: Verify committed source lock against primary bytes
        run: python3 -B research/frontier/cs_prop_6_10_angular_20261126/verify.py --fetch

name: Decoration end cofinality arithmetic
on:
  push:
    branches: [agent/decoration-end-cofinality-20261126]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check exact arithmetic (standard library only)
        run: python -B research/independent_audits/decoration_end_cofinality_20261126/check_arithmetic.py

name: Dudko P4.3 satellite moduli
on:
  push:
    branches: [main]
    paths:
      - 'research/frontier/dudko_p43_satellite_moduli_20261125/**'
      - '.github/workflows/dudko-p43-satellite-moduli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/frontier/dudko_p43_satellite_moduli_20261125/**'
      - '.github/workflows/dudko-p43-satellite-moduli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/frontier/dudko_p43_satellite_moduli_20261125
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Verify exact arithmetic and all committed rows
        run: |
          python -B verify.py --output "$RUNNER_TEMP/p43-results.json"
          cmp "$RUNNER_TEMP/p43-results.json" results.json
      - name: Install pinned PDF reader
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Require complete source audit (including full problem statements and section end)
        run: python -B source_audit.py --output "$RUNNER_TEMP/p43-sources.json"
      - name: Require exact reproduction of the successful source manifest
        run: cmp "$RUNNER_TEMP/p43-sources.json" sources.json

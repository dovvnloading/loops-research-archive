name: dudko-p44-molecule
on:
  pull_request:
    paths:
      - research/frontier/dudko_p44_molecule_20261125/**
      - .github/workflows/dudko-p44-molecule.yml
  push:
    branches: [main]
    paths:
      - research/frontier/dudko_p44_molecule_20261125/**
      - .github/workflows/dudko-p44-molecule.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm
    timeout-minutes: 12
    defaults:
      run:
        working-directory: research/frontier/dudko_p44_molecule_20261125
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Verify exact arithmetic and committed certificate
        run: |
          python -B verify.py --output /tmp/p44-results.json
          cmp results.json /tmp/p44-results.json
      - name: Download versioned PDFs and generate provenance
        run: |
          cp sources.json /tmp/p44-committed-sources.json
          cp NOTE.md /tmp/p44-committed-note.md
          python -B source_lock.py --update-note
      - name: Verify complete committed provenance
        run: |
          cmp sources.json /tmp/p44-committed-sources.json
          cmp NOTE.md /tmp/p44-committed-note.md

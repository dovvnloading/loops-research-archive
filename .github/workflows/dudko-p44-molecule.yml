name: dudko-p44-molecule
on:
  push:
    branches:
      - frontier/dudko-p44-molecule-20261125
  pull_request:
    paths:
      - research/frontier/dudko_p44_molecule_20261125/**
      - .github/workflows/dudko-p44-molecule.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/frontier/dudko-p44-molecule-20261125' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Verify exact arithmetic and committed certificate
        working-directory: research/frontier/dudko_p44_molecule_20261125
        run: |
          python -B verify.py --output /tmp/p44-results.json
          cmp results.json /tmp/p44-results.json
      - name: Download versioned PDFs and generate provenance
        working-directory: research/frontier/dudko_p44_molecule_20261125
        run: python -B source_lock.py --update-note
  record:
    if: github.ref == 'refs/heads/frontier/dudko-p44-molecule-20261125' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Generate source lock and certificate
        id: lock
        continue-on-error: true
        working-directory: research/frontier/dudko_p44_molecule_20261125
        run: |
          python -B verify.py --output /tmp/p44-results.json
          cmp results.json /tmp/p44-results.json
          python -B source_lock.py --update-note
      - name: Commit generated provenance only
        if: always() && steps.lock.outcome != 'skipped'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f research/frontier/dudko_p44_molecule_20261125/sources.json || exit 1
          git add -- research/frontier/dudko_p44_molecule_20261125/NOTE.md research/frontier/dudko_p44_molecule_20261125/results.json research/frontier/dudko_p44_molecule_20261125/sources.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record versioned PDF hashes and page locators'
          git push origin HEAD:refs/heads/frontier/dudko-p44-molecule-20261125
      - name: Require complete source lock
        if: always() && steps.lock.outcome != 'success'
        run: exit 1

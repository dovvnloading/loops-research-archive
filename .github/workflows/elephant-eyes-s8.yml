name: Elephant Eyes section 8
on:
  push:
    branches: [frontier/elephant-eyes-s8-20261126]
  pull_request:
    branches: [main]
    paths:
      - 'research/frontier/elephant_eyes_s8_20261126/**'
      - '.github/workflows/elephant-eyes-s8.yml'
      - 'formalization/physical_bridge_sources.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check -r research/frontier/elephant_eyes_s8_20261126/requirements.txt
      - name: Fetch and verify primary source
        run: python -B research/frontier/elephant_eyes_s8_20261126/verify.py --output "$RUNNER_TEMP/elephant-sources.json"
      - name: Reproduce source manifest or commit first verified record
        shell: bash
        run: |
          set -euo pipefail
          manifest=research/frontier/elephant_eyes_s8_20261126/sources.json
          if test -f "$manifest"; then
            cmp "$RUNNER_TEMP/elephant-sources.json" "$manifest"
          elif [[ "$GITHUB_REF" == "refs/heads/frontier/elephant-eyes-s8-20261126" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            cp "$RUNNER_TEMP/elephant-sources.json" "$manifest"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$manifest"
            git commit -m 'Record verified Elephant Eyes v1 source fingerprint'
            git push origin HEAD:refs/heads/frontier/elephant-eyes-s8-20261126
          else
            echo 'Source manifest missing; only the designated branch can generate it' >&2
            exit 1
          fi
      - name: Check source registration
        run: python -B code/verify_physical_bridges.py

name: Frontier boundary budget and continuation audit
on:
  pull_request:
    paths:
      - 'research/independent_audits/frontier_obstruction_audit_20261126.md'
      - 'code/verify_frontier_obstruction_20261126.py'
      - '.github/workflows/frontier-obstruction-audit-20261126.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact scalar arithmetic (not analytic proof)
        run: python -B code/verify_frontier_obstruction_20261126.py

name: H1 mapping telescope arithmetic checks
on:
  push:
    branches: [h1/mapping-telescope-20261126]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exact rational and polynomial checks (stdlib only)
        run: python -B research/independent_audits/h1_mapping_telescope_20261126/verify.py

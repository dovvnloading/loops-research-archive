name: Interval growth regression

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - '.github/workflows/interval-growth.yml'
      - 'research/independent_audits/verify_interval_growth_repair.py'
      - 'research/independent_audits/interval_growth_repair_20261106.md'
      - 'results/interval_growth_repair_20261106.json'
  pull_request:
    paths:
      - '.github/workflows/interval-growth.yml'
      - 'research/independent_audits/verify_interval_growth_repair.py'
      - 'research/independent_audits/interval_growth_repair_20261106.md'
      - 'results/interval_growth_repair_20261106.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact finite regressions and deterministic manifest
        run: python research/independent_audits/verify_interval_growth_repair.py --check-manifest

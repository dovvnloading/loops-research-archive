name: Issue 40 genuine marked crest transport (physical tip)

on:
  push:
    branches: [main, 'research/**']
    paths:
      - '.github/workflows/issue40-crest-transport.yml'
      - 'research/independent_audits/issue40_crest_transport_20261116/**'
      - 'results/issue40_crest_transport_20261116.json'
      - 'results/issue40_native_attachment_edge_incidence_20261115.json'
      - 'results/tip_root_interval_geometry.json'
      - 'results/tip_KKL_tree_marked_breakage_20261109.json'
  pull_request:
    paths:
      - '.github/workflows/issue40-crest-transport.yml'
      - 'research/independent_audits/issue40_crest_transport_20261116/**'
      - 'results/issue40_crest_transport_20261116.json'
      - 'results/issue40_native_attachment_edge_incidence_20261115.json'
      - 'results/tip_root_interval_geometry.json'
      - 'results/tip_KKL_tree_marked_breakage_20261109.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rigorous-physical-crest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject checked-in bytecode
        run: |
          if git ls-files research/independent_audits/issue40_crest_transport_20261116 | grep -E '__pycache__|\.pyc$'; then
            echo 'Generated bytecode must not be committed'
            exit 1
          fi
      - name: Certify full-radius exact gate and width ratio
        run: |
          python -m py_compile research/independent_audits/issue40_crest_transport_20261116/verify_crest_transport.py
          python research/independent_audits/issue40_crest_transport_20261116/verify_crest_transport.py --check-manifest
      - name: Reject four adversarial changes
        run: python research/independent_audits/issue40_crest_transport_20261116/verify_crest_transport.py --adversarial
      - name: Recheck unchanged physical source certificates
        run: |
          python research/independent_audits/issue40_native_attachment_edge_incidence_20261115/verify_native_attachment_edge_incidence.py --check-manifest
          python research/independent_audits/verify_tip_KKL_tree_marked_breakage.py --check-manifest

  original-lean-kernel-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject existing physical-tip Lean proof shortcuts
        run: |
          if grep -En '(^|[^A-Za-z_])(sorry|admit|axiom|unsafe)([^A-Za-z_]|$)' TipKKLTreeMarking.lean TipNativeProperRestriction.lean; then
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Explicit finite type/kernel regressions
        run: lake build TipKKLTreeMarking TipNativeProperRestriction

  unchanged-research-validation-and-weighted-lean:
    name: Require original Research validation and weighted Lean CI at PR SHA
    needs: [rigorous-physical-crest-gate, original-lean-kernel-regression]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch both unchanged legacy workflows and demand exact-SHA success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo 'PR head moved before dispatch'; exit 1; }
          for workflow in lean-proofs.yml weighted-lean.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$PR_BRANCH"
          done
          for workflow in lean-proofs.yml weighted-lean.yml; do
            found_success=0
            for attempt in $(seq 1 280); do
              runs="$(gh run list --repo "$REPO" --workflow "$workflow" --branch "$PR_BRANCH" --event workflow_dispatch --limit 40 --json databaseId,headSha,status,conclusion)"
              match="$(printf '%s' "$runs" | jq -c --arg sha "$PR_SHA" '[.[] | select(.headSha == $sha)] | first // empty')"
              if [[ -n "$match" ]]; then
                run_id="$(printf '%s' "$match" | jq -r .databaseId)"
                status="$(printf '%s' "$match" | jq -r .status)"
                conclusion="$(printf '%s' "$match" | jq -r .conclusion)"
                if [[ "$status" == completed ]]; then
                  echo "$workflow at $PR_SHA: $conclusion (run $run_id)"
                  if [[ "$conclusion" != success ]]; then
                    gh run view "$run_id" --repo "$REPO" || true
                    exit 1
                  fi
                  found_success=1
                  break
                fi
              fi
              sleep 15
            done
            [[ "$found_success" == 1 ]] || { echo "$workflow lacks an exact-SHA pass"; exit 1; }
          done
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo 'PR moved during validation'; exit 1; }

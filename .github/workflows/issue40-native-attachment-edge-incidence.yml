name: "Issue 40 source-native attachment and edge-incidence audit"

on:
  push:
    branches: [main, 'research/**']
    paths:
      - '.github/workflows/issue40-native-attachment-edge-incidence.yml'
      - 'research/independent_audits/issue40_native_attachment_edge_incidence_20261115/**'
      - 'results/issue40_native_attachment_edge_incidence_20261115.json'
      - 'results/tip_root_interval_geometry.json'
      - 'results/tip_KKL_tree_marked_breakage_20261109.json'
  pull_request:
    paths:
      - '.github/workflows/issue40-native-attachment-edge-incidence.yml'
      - 'research/independent_audits/issue40_native_attachment_edge_incidence_20261115/**'
      - 'results/issue40_native_attachment_edge_incidence_20261115.json'
      - 'results/tip_root_interval_geometry.json'
      - 'results/tip_KKL_tree_marked_breakage_20261109.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-geometry-and-adversarial-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject Python bytecode and other untracked audit files
        run: |
          if git ls-files research/independent_audits/issue40_native_attachment_edge_incidence_20261115 | grep -E '__pycache__|\.pyc$'; then
            echo 'Do not commit generated Python bytecode'
            exit 1
          fi
      - name: Check complete source-derived 256-bit and rational certificate
        run: |
          python -m py_compile research/independent_audits/issue40_native_attachment_edge_incidence_20261115/verify_native_attachment_edge_incidence.py
          python research/independent_audits/issue40_native_attachment_edge_incidence_20261115/verify_native_attachment_edge_incidence.py --check-manifest
      - name: Demand negative controls reject erroneous hypotheses
        run: python research/independent_audits/issue40_native_attachment_edge_incidence_20261115/verify_native_attachment_edge_incidence.py --adversarial
      - name: Re-verify original physical tip marking with unchanged checker
        run: python research/independent_audits/verify_tip_KKL_tree_marked_breakage.py --check-manifest

  existing-lean-kernel-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof placeholders in source Lean files
        run: |
          if grep -En '(^|[^A-Za-z_])(sorry|admit|axiom|unsafe)([^A-Za-z_]|$)' TipKKLTreeMarking.lean TipNativeProperRestriction.lean; then
            echo 'Existing physical tip Lean layers must remain hole-free'
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Explicit original physical-tip finite Lean checks
        run: lake build TipKKLTreeMarking TipNativeProperRestriction

  dispatch-existing-research-and-weighted-lean-ci:
    name: Require completed existing Research validation and weighted Lean checks
    needs: [physical-geometry-and-adversarial-certificate, existing-lean-kernel-regression]
    # Existing workflows' path filters exclude this nested audit; explicitly
    # dispatch and WAIT for both to pass on the exact same-repository PR SHA.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch, monitor, and require both unchanged legacy CI workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          if [[ "$current" != "$PR_SHA" ]]; then
            echo "PR branch changed before legacy validation: $current vs $PR_SHA"
            exit 1
          fi
          for workflow in lean-proofs.yml weighted-lean.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$PR_BRANCH"
          done
          for workflow in lean-proofs.yml weighted-lean.yml; do
            found_success=0
            for attempt in $(seq 1 280); do
              runs="$(gh run list --repo "$REPO" --workflow "$workflow" \
                  --branch "$PR_BRANCH" --event workflow_dispatch \
                  --limit 40 --json databaseId,headSha,status,conclusion)"
              match="$(printf '%s' "$runs" | jq -c --arg sha "$PR_SHA" \
                  '[.[] | select(.headSha == $sha)] | first // empty')"
              if [[ -n "$match" ]]; then
                run_id="$(printf '%s' "$match" | jq -r .databaseId)"
                status="$(printf '%s' "$match" | jq -r .status)"
                conclusion="$(printf '%s' "$match" | jq -r .conclusion)"
                if [[ "$status" == completed ]]; then
                  echo "$workflow at $PR_SHA: $conclusion (run $run_id)"
                  if [[ "$conclusion" != success ]]; then
                    gh run view "$run_id" --repo "$REPO" || true
                    exit 1
                  fi
                  found_success=1
                  break
                fi
              fi
              sleep 15
            done
            if [[ "$found_success" != 1 ]]; then
              echo "No completed successful $workflow at exact PR SHA $PR_SHA"
              exit 1
            fi
          done
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          if [[ "$current" != "$PR_SHA" ]]; then
            echo "PR branch moved while validating; rerun on newest head"
            exit 1
          fi
          echo "PASS: original Research validation and weighted Lean CI on $PR_SHA"

name: Issue 62 prescribed connector footprint gate

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'research/independent_audits/issue62_connector_defects_20261116/**'
      - '.github/workflows/issue62-connector-defects.yml'
  pull_request:
    paths:
      - 'research/independent_audits/issue62_connector_defects_20261116/**'
      - '.github/workflows/issue62-connector-defects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-audit:
    name: Exact sources, J-side footprints and nonabelian words
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject Python syntax and keep all 88 manifest rows source-reproducible
        run: |
          python -m py_compile research/independent_audits/issue62_connector_defects_20261116/verify_issue62.py
          python research/independent_audits/issue62_connector_defects_20261116/verify_issue62.py --check-manifest
      - name: Recheck original KL source atlas, rooted section and native deck
        run: |
          python research/independent_audits/verify_tip_kl_side_atlas.py --check-manifest
          python research/independent_audits/verify_tip_rooted_native_KL_section.py --check-manifest
          python research/independent_audits/verify_tip_native_root_deck_monodromy.py --check-manifest
      - name: Recheck C4 wake, strict J trichotomy and all original ideal types
        run: |
          python research/independent_audits/verify_tip_native_C4_wake_root_matrix.py --check-manifest
          python research/independent_audits/verify_tip_native_ideal_side_exclusions.py --check-manifest
          python research/independent_audits/verify_tip_native_finite_J_side_trichotomy.py --check-manifest
          python research/independent_audits/verify_tip_native_full_W_ideal_circle_types.py --check-manifest
      - name: Recheck original KL W-to-V proper path/tail first failure
        run: |
          python research/independent_audits/verify_tip_native_two_proper_restrictions.py --check-manifest
      - name: Standard research provenance and README integrity mirrors
        run: |
          python code/verify_lean_frontier_sync.py
          python code/verify_readme_integrity.py
          node code/generate_readme_research_figures.mjs --check

  lean-and-formal-audits:
    name: Existing Lean CI build and new finite word controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes in the new discrete-only file
        run: |
          if grep -En '(^|[^A-Za-z_])(sorry|admit)([^A-Za-z_]|$)' research/independent_audits/issue62_connector_defects_20261116/RelativeDeck.lean; then
            echo 'Lean proof placeholders are forbidden'
            exit 1
          fi
      - name: Build all already registered formal audit modules
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Compile the new faithful discrete F9 word controls without changing Lake
        run: lake env lean research/independent_audits/issue62_connector_defects_20261116/RelativeDeck.lean

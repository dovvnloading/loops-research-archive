name: KKL Lemma 6.24 source audit
on:
  push:
    branches: [frontier/kkl-lemma-6-24-20261125]
  pull_request:
    paths:
      - 'research/frontier/kkl_lemma_6_24_audit_20261125/**'
      - '.github/workflows/kkl-lemma-6-24.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kkl-6-24-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - name: Install pinned extractor
        run: python -m pip install --no-deps -r research/frontier/kkl_lemma_6_24_audit_20261125/requirements.txt
      - name: Verify source locations and hashes
        run: python research/frontier/kkl_lemma_6_24_audit_20261125/verify.py
      - name: Record generated source lock on audit branch only
        if: github.ref == 'refs/heads/frontier/kkl-lemma-6-24-20261125' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          p=research/frontier/kkl_lemma_6_24_audit_20261125/source_lock.json
          git add -- "$p"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record KKL/DL versioned PDF source lock'
          git fetch origin 'frontier/kkl-lemma-6-24-20261125'
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/frontier/kkl-lemma-6-24-20261125

name: KKL width-maximal audit
on:
  push:
    branches: [frontier/kkl-width-maximal-20261126]
  pull_request:
    paths:
      - 'research/frontier/kkl_width_maximal_20261126/**'
      - '.github/workflows/kkl-width-maximal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kkl-width-maximal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - name: Install pinned extractor
        run: python -m pip install --no-deps -r research/frontier/kkl_width_maximal_20261126/requirements.txt
      - name: Verify arithmetic and versioned PDF sources
        run: python research/frontier/kkl_width_maximal_20261126/verify.py
      - name: Record generated lock on dedicated branch
        if: github.ref == 'refs/heads/frontier/kkl-width-maximal-20261126' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          p=research/frontier/kkl_width_maximal_20261126/source_lock.json
          git add -- "$p"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record width-maximal source and arithmetic lock'
          git fetch origin 'frontier/kkl-width-maximal-20261126'
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/frontier/kkl-width-maximal-20261126
      - name: Check committed lock reproduces on PR
        if: github.event_name == 'pull_request'
        run: |
          git ls-files --error-unmatch research/frontier/kkl_width_maximal_20261126/source_lock.json
          git diff --exit-code -- research/frontier/kkl_width_maximal_20261126/source_lock.json
      - name: Check standalone verifier registration
        run: python -B code/verify_physical_bridges.py

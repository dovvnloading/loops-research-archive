name: Research validation

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - lean-toolchain
      - lakefile.toml
      - lake-manifest.json
      - 'LoopsFormal.lean'
      - 'CloneGraph.lean'
      - 'FirstReturn.lean'
      - 'ReturnBlocks.lean'
      - 'ReturnPaths.lean'
      - 'Paper2Phase.lean'
      - 'RealTwoScalePhase.lean'
      - 'Period27Kneading.lean'
      - 'Period27Dyadic.lean'
      - 'Period27IntervalSound.lean'
      - 'Period27RationalTrace.lean'
      - 'Period27RationalDerivative.lean'
      - 'PhaseTower.lean'
      - 'PhaseTower27.lean'
      - 'PhaseFuture.lean'
      - 'PhaseFuture27.lean'
      - 'TipRayPortrait.lean'
      - '.github/workflows/lean-proofs.yml'
      - 'research/independent_audits/*.py'
      - 'research/independent_audits/*.md'
      - 'results/period27_symbolic_marking.json'
      - 'results/period27_misiurewicz_tip.json'
      - 'results/period27_tip_ray_portrait.json'
      - 'RESEARCH_MAP.md'
      - 'README.md'
      - 'figs/readme/*.svg'
      - 'code/verify_readme_integrity.py'
      - 'ledger.json'
      - 'ledger.js'
      - 'research/mlc_unified/proof_obligations.json'
      - 'papers/paper2_rooted_end_compactification/main_v2.tex'
  pull_request:
    paths:
      - lean-toolchain
      - lakefile.toml
      - lake-manifest.json
      - 'LoopsFormal.lean'
      - 'CloneGraph.lean'
      - 'FirstReturn.lean'
      - 'ReturnBlocks.lean'
      - 'ReturnPaths.lean'
      - 'Paper2Phase.lean'
      - 'RealTwoScalePhase.lean'
      - 'Period27Kneading.lean'
      - 'Period27Dyadic.lean'
      - 'Period27IntervalSound.lean'
      - 'Period27RationalTrace.lean'
      - 'Period27RationalDerivative.lean'
      - 'PhaseTower.lean'
      - 'PhaseTower27.lean'
      - 'PhaseFuture.lean'
      - 'PhaseFuture27.lean'
      - 'TipRayPortrait.lean'
      - '.github/workflows/lean-proofs.yml'
      - 'research/independent_audits/*.py'
      - 'research/independent_audits/*.md'
      - 'RESEARCH_MAP.md'
      - 'README.md'
      - 'figs/readme/*.svg'
      - 'code/verify_readme_integrity.py'
      - 'ledger.json'
      - 'ledger.js'
      - 'research/mlc_unified/proof_obligations.json'
      - 'papers/paper2_rooted_end_compactification/main_v2.tex'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes
        run: |
          if grep -En '(^|[^A-Za-z_])(sorry|admit)([^A-Za-z_]|$)' LoopsFormal.lean CloneGraph.lean FirstReturn.lean ReturnBlocks.lean ReturnPaths.lean Paper2Phase.lean RealTwoScalePhase.lean Period27Kneading.lean Period27Dyadic.lean Period27IntervalSound.lean Period27RationalTrace.lean Period27RationalDerivative.lean PhaseTower.lean PhaseTower27.lean PhaseFuture.lean PhaseFuture27.lean TipRayPortrait.lean; then
            echo 'Proof placeholders are prohibited in formal audit files.'
            exit 1
          fi
      - name: Install Lean and build proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify README links, charts, and source-locked ledger totals
        run: python code/verify_readme_integrity.py
      - name: Install numerical-test dependency
        run: python -m pip install 'numpy>=2,<3'
      - name: Check finite delayed-clone matrices
        run: python research/independent_audits/verify_clone_spectral.py
      - name: Check complete first-return edge-occurrence counts
        run: python research/independent_audits/verify_clone_first_returns.py
      - name: Check exact rational weighted-return identity
        run: python research/independent_audits/verify_weighted_return_exact.py
      - name: Check full cloned adjacency eigenvector identity
        run: python research/independent_audits/verify_full_clone_adjacency.py
      - name: Check full clone spectral radius numerically
        run: python research/independent_audits/verify_full_clone_spectral_radius.py
      - name: Certify two nested physical real quadratic return intervals
        run: python research/independent_audits/verify_real_nested_3_9.py
      - name: Certify parameter attraction and thin-stadium obstructions
        run: python research/independent_audits/verify_complex_window_obstructions.py
      - name: Certify proper complex quadratic-like returns at both scales
        run: python research/independent_audits/verify_complex_quadratic_like_3_9.py
      - name: Certify candidate external-angle kneading and exact real Markov spine
        run: python research/independent_audits/verify_period27_symbolic_atlas.py --check-manifest
      - name: Compare real period-27 kneading angle and twisted-shift permutation
        run: python research/independent_audits/verify_period27_kneading_angle_permutation.py
      - name: Check physical exterior 9-to-3 dyadic inverse-ray addresses and trace scaling
        run: python research/independent_audits/verify_period27_exterior_pullback.py
      - name: Certify nonattracting 3/9 Misiurewicz tip and ray angles
        run: python research/independent_audits/verify_period27_misiurewicz_tip.py --check-manifest
      - name: Kernel-independent exact period-nine tip ray portrait
        run: python research/independent_audits/verify_tip_ray_portrait.py --check-manifest
      - name: Check finite Dirichlet-to-Neumann gluing
        run: python research/independent_audits/verify_rectangle_response.py
      - name: Check Paper 2 geometric source and return-time patch structure
        run: python research/independent_audits/verify_paper2_source_clock.py
      - name: Check ledger mirrors, statuses and evidence pointers
        run: python research/independent_audits/check_ledger_mirrors.py
      - name: Report remaining evidence-pointer debt (non-blocking)
        run: python research/independent_audits/audit_ledger_evidence.py .

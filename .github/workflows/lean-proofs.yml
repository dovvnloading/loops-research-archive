      - 'results/tip_native_full_W_ideal_circle_types_20261109.json'
      - 'results/tip_native_ideal_side_exclusions_20261108.json'
      - 'results/tip_native_finite_J_side_trichotomy_20261109.json'
      - 'results/tip_native_C4_wake_root_matrix_20261109.json'
      - 'results/tip_native_root_deck_monodromy_20261109.json'

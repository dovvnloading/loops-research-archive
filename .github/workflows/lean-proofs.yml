  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes
        run: |
          if grep -En '(^|[^A-Za-z_])(sorry|admit)([^A-Za-z_]|$)' LoopsFormal.lean CloneGraph.lean FirstReturn.lean ReturnBlocks.lean ReturnPaths.lean Paper2Phase.lean RealTwoScalePhase.lean Period27Kneading.lean Period27Dyadic.lean Period27IntervalSound.lean Period27RationalTrace.lean Period27RationalDerivative.lean PhaseTower.lean PhaseTower27.lean PhaseFuture.lean PhaseFuture27.lean PhaseMemoryGeneral.lean AirplaneDiffraction.lean MandelbrotSpectrum.lean TipRayPortrait.lean TipComplexMargins.lean TipKLPuzzle.lean TipActualCoarseRays.lean TipLevinComposition.lean TipSheetGrid.lean TipRootedNativeKL.lean TipNativeRootDeck.lean TipNativeC4Wake.lean TipNativeSideExclusion.lean TipNativeFiniteJTrichotomy.lean TipNativeFullBoundaryTypes.lean TipKKLTreeMarking.lean TipNativeProperRestriction.lean ResearchLedger.lean ResearchGates.lean TipNativeDeckWords.lean; then
            echo 'Proof placeholders are prohibited in formal audit files.'
            exit 1
          fi
      - name: Install Lean and build proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify README links, exact research figures and ledger provenance
        run: python code/verify_readme_integrity.py
      - name: Verify source ledger dependency and Lean status mirror
        run: python code/verify_lean_frontier_sync.py
      - name: Verify generated SVGs match exact source manifests
        run: node code/generate_readme_research_figures.mjs --check
      - name: Install numerical-test dependency
        run: python -m pip install 'numpy>=2,<3'
      - name: Check boundary-spectrum exact rational regression
        run: python research/independent_audits/verify_mlc_boundary_spectrum.py
      - name: Check exact Mandelbrot coefficient packets and locked 511-manifest
        run: python research/independent_audits/verify_mlc_spectrum_extended.py --max-index 511 --check-manifest results/mlc_spectrum_exact_511_20261112.json
      - name: Check finite delayed-clone matrices
        run: python research/independent_audits/verify_clone_spectral.py
      - name: Check complete first-return edge-occurrence counts
        run: python research/independent_audits/verify_clone_first_returns.py
      - name: Check exact rational weighted-return identity
        run: python research/independent_audits/verify_weighted_return_exact.py
      - name: Check full cloned adjacency eigenvector identity
        run: python research/independent_audits/verify_full_clone_adjacency.py
      - name: Check full clone spectral radius numerically
        run: python research/independent_audits/verify_full_clone_spectral_radius.py
      - name: Check clone characteristic determinants and spectral separation
        run: python research/independent_audits/verify_clone_strict_gap.py
      - name: Certify two nested physical real quadratic return intervals
        run: python research/independent_audits/verify_real_nested_3_9.py
      - name: Certify parameter attraction and thin-stadium obstructions
        run: python research/independent_audits/verify_complex_window_obstructions.py
      - name: Certify proper complex quadratic-like returns at both scales
        run: python research/independent_audits/verify_complex_quadratic_like_3_9.py
      - name: Certify candidate external-angle kneading and exact real Markov spine
        run: python research/independent_audits/verify_period27_symbolic_atlas.py --check-manifest
      - name: Compare real period-27 kneading angle and twisted-shift permutation
        run: python research/independent_audits/verify_period27_kneading_angle_permutation.py
      - name: Verify exact finite inputs to the triple-airplane center identification
        run: python research/independent_audits/verify_period27_center_tuning_identification.py
      - name: Check airplane diffraction, ray reconstruction and Markov observability
        working-directory: research/independent_audits/airplane_inverse_problems_20261114
        run: |
          python diffraction/verify_airplane_phase_retrieval.py
          python study/verify_geometric_readout.py
          python chords/verify.py --scales 64 --manifest ../../../results/period27_tip_ray_portrait.json
          python markov/verify_markov.py --depth 6 --manifest ../../../results/period27_symbolic_marking.json
      - name: Check physical exterior 9-to-3 dyadic inverse-ray addresses and trace scaling
        run: python research/independent_audits/verify_period27_exterior_pullback.py
      - name: Certify nonattracting 3/9 Misiurewicz tip and ray angles
        run: python research/independent_audits/verify_period27_misiurewicz_tip.py --check-manifest
      - name: Kernel-independent exact period-nine tip ray portrait
        run: python research/independent_audits/verify_tip_ray_portrait.py --check-manifest
      - name: Verify nonattracting tip complex 3/9 margins and exact manifest
        run: python research/independent_audits/verify_tip_complex_domains.py --check-manifest
      - name: Check exact Levin 3/9 ray eligibility arithmetic and forced monotone angle sextuple
        run: python research/independent_audits/verify_tip_levin_transport.py
      - name: Check exact tip KL dividing puzzle, escape and localization witnesses
        run: python research/independent_audits/verify_tip_kl_puzzle.py
      - name: Verify complete landed ambient alpha-ray table through puzzle depth six
        run: python research/independent_audits/verify_tip_puzzle_ray_tree.py --check-manifest
      - name: Verify actual ambient lifts of the G-internal puzzle through depth six
        run: python research/independent_audits/verify_tip_internal_ray_lifts.py --check-manifest
      - name: Verify finite inputs to both terminal KL first-child nests
        run: python research/independent_audits/verify_tip_kl_terminal_first_child.py
      - name: Verify exact interval phases and finite inputs to the root-type obstruction
        run: python research/independent_audits/verify_tip_root_topology.py --check-manifest
      - name: Verify actual ordinary KL side atlas and finite side collisions
        run: python research/independent_audits/verify_tip_kl_side_atlas.py --check-manifest
      - name: Check finite Dirichlet-to-Neumann gluing
        run: python research/independent_audits/verify_rectangle_response.py
      - name: Check Paper 2 geometric source and return-time patch structure
        run: python research/independent_audits/verify_paper2_source_clock.py
      - name: Check ledger mirrors, statuses and evidence pointers
        run: python research/independent_audits/check_ledger_mirrors.py
      - name: Report remaining evidence-pointer debt (non-blocking)
        run: python research/independent_audits/audit_ledger_evidence.py .

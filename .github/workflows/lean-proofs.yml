      - 'results/period27_tip_ray_portrait.json'
      - 'results/tip_puzzle_ray_tree.json'
      - 'results/tip_internal_ray_lifts.json'
      - 'results/tip_root_interval_geometry.json'
      - 'results/tip_kl_side_atlas.json'

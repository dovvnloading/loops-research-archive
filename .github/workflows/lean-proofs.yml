      - 'FirstReturn.lean'
      - 'ReturnBlocks.lean'
      - 'ReturnPaths.lean'
      - 'Paper2Phase.lean'
      - 'RealTwoScalePhase.lean'
      - 'Period27Kneading.lean'
      - 'AirplaneDiffraction.lean'
      - 'MandelbrotSpectrum.lean'
      - 'research/independent_audits/airplane_inverse_problems_20261114/**'
      - 'Period27Dyadic.lean'
      - 'Period27IntervalSound.lean'
      - 'Period27RationalTrace.lean'
      - 'Period27RationalDerivative.lean'
      - 'PhaseTower.lean'
      - 'PhaseTower27.lean'
      - 'PhaseFuture.lean'
      - 'PhaseFuture27.lean'
      - 'PhaseMemoryGeneral.lean'
      - 'TipRayPortrait.lean'
      - 'TipComplexMargins.lean'
      - 'TipKLPuzzle.lean'
      - 'TipActualCoarseRays.lean'

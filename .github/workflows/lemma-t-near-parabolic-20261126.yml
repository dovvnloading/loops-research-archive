name: Lemma T near-parabolic compactness audit
on:
  push:
    branches:
      - frontier/lemma-t-near-parabolic-20261126
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Check finite diagnostics and locked primary PDFs
        run: python -B research/frontier/lemma_t_near_parabolic_20261126/verify.py --fetch
      - name: Check source registration
        run: python -B code/verify_physical_bridges.py

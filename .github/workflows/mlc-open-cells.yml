name: MLC open cells
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-cells:
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 6
    defaults:
      run:
        working-directory: research/frontier/mlc_open_cells_20261126
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact atlas census and committed source provenance
        run: python -B verify.py

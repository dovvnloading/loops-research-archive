name: MLC open cells
on:
  push:
    branches: [frontier/mlc-open-cells-20261126]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open-cells:
    runs-on: ubuntu-latest
    container: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
    timeout-minutes: 6
    defaults:
      run:
        working-directory: research/frontier/mlc_open_cells_20261126
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check exact atlas census and source locators
        run: python -B verify.py
      - name: Fetch and commit byte provenance on audit branch only
        if: github.ref == 'refs/heads/frontier/mlc-open-cells-20261126' && github.event_name != 'pull_request'
        run: |
          python -B hash_inputs.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- input_hashes.json
          if ! git diff --cached --quiet; then
            git commit -m "Record open-cells input SHA-256 provenance"
            git push origin HEAD:frontier/mlc-open-cells-20261126
          fi

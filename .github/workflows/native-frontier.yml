name: Native-interface research checks

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
      - 'research/independent_audits/immersion_mark_resolution_20261124/**'
      - 'research/independent_audits/canonical_width_attack_20261124/**'
      - 'research/independent_audits/native_mark_attack_20261124/**'
      - 'research/independent_audits/stationary_transport_attack_20261124/**'
      - 'research/independent_audits/native_resolution_20261124.md'
      - 'research/independent_audits/maximal_*_20261123/**'
      - 'research/independent_audits/issue62_connector*/**'
      - 'research/independent_audits/real_primitive_tip_family*/**'
      - 'research/independent_audits/tip_family_limiting_wave_gain_20261116/**'
      - 'research/independent_audits/tip_family_hypothesis_M_discharge_20261116/**'
      - '.github/workflows/native-frontier.yml'
  pull_request:
    paths:
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
      - 'research/independent_audits/immersion_mark_resolution_20261124/**'
      - 'research/independent_audits/canonical_width_attack_20261124/**'
      - 'research/independent_audits/native_mark_attack_20261124/**'
      - 'research/independent_audits/stationary_transport_attack_20261124/**'
      - 'research/independent_audits/native_resolution_20261124.md'
      - 'research/independent_audits/maximal_*_20261123/**'
      - 'research/independent_audits/issue62_connector*/**'
      - 'research/independent_audits/real_primitive_tip_family*/**'
      - 'research/independent_audits/tip_family_limiting_wave_gain_20261116/**'
      - 'research/independent_audits/tip_family_hypothesis_M_discharge_20261116/**'
      - '.github/workflows/native-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-consequences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Check exact-commit workflow gate and cancellation handling
        run: python -B -m unittest discover -s code -p 'test_require_exact_head_workflows.py' -v
      - name: Check native connector feasibility and path-order controls
        run: python -B research/independent_audits/maximal_root_landing_20261123/verify.py
      - name: Check singleton-cut finite regressions
        run: python -B research/independent_audits/maximal_global_closure_20261123/verify_cutpoint_pruning.py
      - name: Check exterior conjugacy identities
        run: python -B research/independent_audits/maximal_global_closure_20261123/verify_exterior_gauge.py
      - name: Check physical cut derivation and subarc arithmetic
        run: python -B research/independent_audits/maximal_native_wave_20261123/verify.py
      - name: Check selected slit marking and endpoint-aware saturation
        run: python -B research/independent_audits/immersion_mark_resolution_20261124/verify.py
      - name: Check all-class canonical buffer exclusion and exact manifest
        run: python -B research/independent_audits/canonical_width_attack_20261124/verify.py --check-manifest
      - name: Test canonical-width normalization and analytic dependency guards
        run: python -B -m unittest discover -s research/independent_audits/canonical_width_attack_20261124 -p 'test_verify.py' -v
      - name: Check source-eligible finite native action
        run: python -B research/independent_audits/native_mark_attack_20261124/verify.py --check-manifest
      - name: Check variable-end exit width budgets
        run: python -B research/independent_audits/stationary_transport_attack_20261124/verify.py
      - name: Replay exact full-path width arithmetic and corrected tail
        run: python -B research/independent_audits/maximal_native_wave_20261123/verify_width.py
      - name: Check corrected large-period error arithmetic
        run: python -B research/independent_audits/tip_family_limiting_wave_gain_20261116/test_verify.py
      - name: Check dependent marking certificate constants
        run: python -B research/independent_audits/tip_family_hypothesis_M_discharge_20261116/test_verify.py
      - name: Check proof-source and status contracts
        run: python -B code/verify_physical_bridges.py

name: Open-cell certification
on:
  push:
    branches: [frontier/open-cell-cert-20261126]
  pull_request:
    paths:
      - 'research/frontier/open_cell_certification_20261126/**'
      - '.github/workflows/open-cell-cert-20261126.yml'
      - 'formalization/physical_bridge_sources.tsv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify finite atlas certificate
        run: python -B research/frontier/open_cell_certification_20261126/verify.py
      - name: Verify atlas decisions and historical PDF checksums
        run: python -B research/frontier/open_cell_certification_20261126/verify.py --check-downloads
      - name: Check bridge source registration
        run: python -B code/verify_physical_bridges.py
      - name: Assert checkout unchanged
        run: git diff --exit-code

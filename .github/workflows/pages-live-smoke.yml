name: Public Pages smoke test

on:
  workflow_run:
    workflows: ['Deploy fractal engine']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployed-website:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the deployed engine, exact-data boundary, and scholarly URLs
        run: python3 code/verify_deployed_site.py

name: Quantitative frontier audit certificates
on:
  push:
    branches: [research/quantitative-frontier-audit-20261126]
  pull_request:
    paths:
      - 'research/frontier/quantitative_frontier_audit_20261126/**'
      - '.github/workflows/quantitative-frontier-audit-20261126.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pressure and analytic-domain certificate
        run: python -B research/frontier/quantitative_frontier_audit_20261126/check.py
      - name: All-history scalar separation certificate
        run: python -B research/frontier/quantitative_frontier_audit_20261126/check_scalar.py

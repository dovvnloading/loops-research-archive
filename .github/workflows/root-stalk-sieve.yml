name: Root-stalk closed-crest sieve

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - '.github/workflows/root-stalk-sieve.yml'
      - 'research/independent_audits/verify_root_stalk_sieve.py'
      - 'research/independent_audits/kkl_exact_root_stalk_sieve_20261106.md'
      - 'results/root_stalk_sieve_20261106.json'
  pull_request:
    paths:
      - '.github/workflows/root-stalk-sieve.yml'
      - 'research/independent_audits/verify_root_stalk_sieve.py'
      - 'research/independent_audits/kkl_exact_root_stalk_sieve_20261106.md'
      - 'results/root_stalk_sieve_20261106.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cyclic-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check full finite marking census and deterministic manifest
        run: |
          python -m py_compile research/independent_audits/verify_root_stalk_sieve.py
          python research/independent_audits/verify_root_stalk_sieve.py --check-manifest

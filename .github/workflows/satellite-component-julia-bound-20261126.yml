name: Satellite component attachment Julia bound
on:
  pull_request:
    paths:
      - 'research/frontier/satellite_component_julia_bound_20261126/**'
      - '.github/workflows/satellite-component-julia-bound-20261126.yml'
      - 'formalization/physical_bridge_sources.tsv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Check exact finite arithmetic
        run: python -B research/frontier/satellite_component_julia_bound_20261126/verify.py
      - name: Check source registration
        run: python -B code/verify_physical_bridges.py

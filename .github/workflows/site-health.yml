name: Site health

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'index.html', 'ledger.json', 'results/**', 'docs/DEPLOYMENT.md', 'code/verify_site_integrity.py', '.github/workflows/site-health.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'index.html', 'ledger.json', 'results/**', 'docs/DEPLOYMENT.md', 'code/verify_site_integrity.py', '.github/workflows/site-health.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-application:
    name: Build, exact arithmetic, provenance and archive integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 code/verify_site_integrity.py

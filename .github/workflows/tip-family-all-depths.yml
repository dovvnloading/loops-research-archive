name: Tip family all-depths: honest scope and exact depth-three audit

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/independent_audits/tip_family_all_depths_20261116/**'
      - '.github/workflows/tip-family-all-depths.yml'
  pull_request:
    paths:
      - 'research/independent_audits/tip_family_all_depths_20261116/**'
      - '.github/workflows/tip-family-all-depths.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tip-family-all-depths-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rational-depth-three:
    name: Depth-three rigorous inequalities and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forbid generated bytecode in new tracked files
        run: |
          if git ls-files research/independent_audits/tip_family_all_depths_20261116 | grep -E '(__pycache__|\.pyc$)'; then
            echo 'Generated bytecode must not be committed.'
            exit 1
          fi
      - name: Verify exact depth-three chart and negative tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/independent_audits/tip_family_all_depths_20261116/verify.py
          python -B -m unittest discover -s research/independent_audits/tip_family_all_depths_20261116 -p 'test_*.py' -v
      - name: Recheck merged depth-two and level-one theorem chain
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/independent_audits/tip_family_renormalization_depth_20261116/verify.py
          python -B -m unittest discover -s research/independent_audits/tip_family_renormalization_depth_20261116 -p 'test_*.py' -v
          python -B research/tip_family_theorem/verify_chain.py
      - name: Verify no existing files changed by arithmetic checks
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain --untracked-files=all | tee /tmp/status.txt
          if test -s /tmp/status.txt; then
            echo 'Verification must be strictly read only.'
            exit 1
          fi

  unchanged-lean-build:
    name: Existing Lean kernel builds without adding axioms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reject Lean proof holes
        run: |
          set -euo pipefail
          if grep -En '(^|[^A-Za-z_])(sorry|admit)([^A-Za-z_]|$)' LoopsFormal.lean CloneGraph.lean FirstReturn.lean ReturnBlocks.lean ReturnPaths.lean Paper2Phase.lean RealTwoScalePhase.lean Period27Kneading.lean Period27Dyadic.lean Period27IntervalSound.lean Period27RationalTrace.lean Period27RationalDerivative.lean PhaseTower.lean PhaseTower27.lean PhaseFuture.lean PhaseFuture27.lean PhaseMemoryGeneral.lean AirplaneDiffraction.lean MandelbrotSpectrum.lean TipRayPortrait.lean TipComplexMargins.lean TipKLPuzzle.lean TipActualCoarseRays.lean TipLevinComposition.lean TipSheetGrid.lean TipRootedNativeKL.lean TipNativeRootDeck.lean TipNativeC4Wake.lean TipNativeSideExclusion.lean TipNativeFiniteJTrichotomy.lean TipNativeFullBoundaryTypes.lean TipKKLTreeMarking.lean TipNativeProperRestriction.lean ResearchLedger.lean ResearchGates.lean TipNativeDeckWords.lean; then
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

  original-workflows-at-pr-sha:
    name: Require original Research validation and weighted Lean
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [rational-depth-three, unchanged-lean-build]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch and await both existing workflows at identical head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo 'PR SHA changed'; exit 1; }
          for workflow in lean-proofs.yml weighted-lean.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$PR_BRANCH"
          done
          for workflow in lean-proofs.yml weighted-lean.yml; do
            found=0
            for attempt in $(seq 1 320); do
              runs="$(gh run list --repo "$REPO" --workflow "$workflow" --branch "$PR_BRANCH" --event workflow_dispatch --limit 40 --json databaseId,headSha,status,conclusion)"
              match="$(printf '%s' "$runs" | jq -c --arg sha "$PR_SHA" '[.[] | select(.headSha == $sha)] | first // empty')"
              if [[ -n "$match" ]]; then
                run_id="$(printf '%s' "$match" | jq -r .databaseId)"
                status="$(printf '%s' "$match" | jq -r .status)"
                conclusion="$(printf '%s' "$match" | jq -r .conclusion)"
                if [[ "$status" == completed ]]; then
                  echo "$workflow at $PR_SHA: $conclusion (run $run_id)"
                  [[ "$conclusion" == success ]] || { gh run view "$run_id" --repo "$REPO" || true; exit 1; }
                  found=1
                  break
                fi
              fi
              sleep 15
            done
            [[ "$found" == 1 ]] || { echo "$workflow lacks exact-SHA success"; exit 1; }
          done
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo 'PR SHA moved during validation'; exit 1; }

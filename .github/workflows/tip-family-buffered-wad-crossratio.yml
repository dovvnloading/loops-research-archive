name: Tip-family buffered WAD physical crossratios (partial, exact)

on:
  pull_request:
    paths:
      - 'research/independent_audits/tip_family_buffered_wad_crossratio_20261116/**'
      - '.github/workflows/tip-family-buffered-wad-crossratio.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  push:
    branches: [main]
    paths:
      - 'research/independent_audits/tip_family_buffered_wad_crossratio_20261116/**'
      - '.github/workflows/tip-family-buffered-wad-crossratio.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossratio-exact:
    name: Exact physical quadrilateral/AGM intervals, hostile tests and pinned audits
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce exactly four additions, never change preexisting files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The add-only scope is the initial package-creation contract.
          # Maintenance must retain all mathematical and exact-head checks.
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:research/independent_audits/tip_family_buffered_wad_crossratio_20261116" 2>/dev/null; then
            echo "Existing package at exact PR base; running maintenance checks"
            exit 0
          fi
          mapfile -t changes < <(git diff --name-status "$BASE_SHA...HEAD")
          [[ "${#changes[@]}" -eq 4 ]] || {
            printf 'Expected four additions, got:\n%s\n' "${changes[*]}"; exit 1;
          }
          for change in "${changes[@]}"; do
            IFS=$'\t' read -r status path <<< "$change"
            [[ "$status" == A ]] || { echo "Existing-file edit: $change"; exit 1; }
            case "$path" in
              .github/workflows/tip-family-buffered-wad-crossratio.yml|\
              research/independent_audits/tip_family_buffered_wad_crossratio_20261116/NOTE.md|\
              research/independent_audits/tip_family_buffered_wad_crossratio_20261116/verify.py|\
              research/independent_audits/tip_family_buffered_wad_crossratio_20261116/test_verify.py) ;;
              *) echo "Unexpected file: $path"; exit 1 ;;
            esac
          done
      - name: Parse Python and enforce open-result scope
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          d=Path('research/independent_audits/tip_family_buffered_wad_crossratio_20261116')
          for p in (d/'verify.py', d/'test_verify.py'):
              ast.parse(p.read_text(), filename=str(p))
          note=(d/'NOTE.md').read_text()
          for word in ('PARTIAL', 'OPEN', 'K2', 'AGM', '12\\sqrt2-16',
                       'f_*', r'\iota^*', 'Numerical-only',
                       'p>=13', 'NOT', 'reflection'):
              assert word.lower() in note.lower(), word
          PY
      - name: Verify selected physical p3..12 and all-p tail crossratios
        run: python -B research/independent_audits/tip_family_buffered_wad_crossratio_20261116/verify.py
      - name: Adversarial exact arithmetic, geometry and no-support-claim tests
        run: python -B -m unittest discover -s research/independent_audits/tip_family_buffered_wad_crossratio_20261116 -p 'test_*.py' -v
      - name: Replay prior canonical four-boundary manifest, outer/inner WAD and M-discharge
        run: |
          python -B research/independent_audits/canonical_wad_quadrilateral_moduli_20261116/verify.py --check-manifest
          python -B research/independent_audits/tip_family_buffered_wad_inner_20261116/verify.py
          python -B research/independent_audits/tip_family_hypothesis_M_discharge_20261116/verify.py
      - name: Check verification made no tracked or untracked file changes
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            git status --short
            echo 'Verification wrote files'; exit 1;
          }

  unchanged-research-and-weighted-lean:
    name: Require unchanged Research validation and Weighted Lean on exact PR SHA
    needs: crossratio-exact
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-head reuse, cancellation replacement and failure semantics
        run: python -B -m unittest discover -s code -p 'test_require_exact_head_workflows.py' -v
      - name: Require both original workflows at the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -B code/require_exact_head_workflows.py --attempts 480

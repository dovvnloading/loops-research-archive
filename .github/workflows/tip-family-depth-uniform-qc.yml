name: "Tip family direct-depth QC: conditional KKL audit"

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/independent_audits/tip_family_depth_uniform_qc_20261116/**'
      - '.github/workflows/tip-family-depth-uniform-qc.yml'
  pull_request:
    paths:
      - 'research/independent_audits/tip_family_depth_uniform_qc_20261116/**'
      - '.github/workflows/tip-family-depth-uniform-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tip-family-depth-uniform-qc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-exact-scope:
    name: Exact depth-three regression and adversarial conditional algebra
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject edits outside the two permitted new paths
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          git diff --name-only "$base" HEAD | while IFS= read -r path; do
            case "$path" in
              research/independent_audits/tip_family_depth_uniform_qc_20261116/*|.github/workflows/tip-family-depth-uniform-qc.yml)
                ;;
              *)
                echo "Forbidden existing file changed: $path"
                exit 1
                ;;
            esac
          done
      - name: Reject generated bytecode in tracked new files
        run: |
          set -euo pipefail
          if git ls-files research/independent_audits/tip_family_depth_uniform_qc_20261116 | grep -E '(__pycache__|\.pyc$)'; then
            echo 'No bytecode files may be committed.'
            exit 1
          fi
      - name: Verify typed marking and strict (3,3,3) rational bounds
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/independent_audits/tip_family_depth_uniform_qc_20261116/verify.py
          python -B -m unittest discover -s research/independent_audits/tip_family_depth_uniform_qc_20261116 -p 'test_*.py' -v
      - name: Rerun unchanged merged original strict packet
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/independent_audits/tip_family_all_depths_20261116/verify.py
          python -B -m unittest discover -s research/independent_audits/tip_family_all_depths_20261116 -p 'test_*.py' -v
          python -B research/tip_family_theorem/verify_chain.py
      - name: Require strictly read-only audit execution
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain --untracked-files=all | tee /tmp/audit-status
          test ! -s /tmp/audit-status

  existing-lean-kernel:
    name: Rebuild unchanged Lean proofs without adding axioms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: No new Lean or proof holes
        run: |
          set -euo pipefail
          if grep -En '(^|[^A-Za-z_])(sorry|admit)([^A-Za-z_]|$)' TipKKLTreeMarking.lean TipNativeProperRestriction.lean; then
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Recheck unchanged discrete marking
        run: lake build TipKKLTreeMarking TipNativeProperRestriction

  existing-ci-at-pr-head:
    name: Require existing Research validation and Weighted Lean at exact head SHA
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [finite-exact-scope, existing-lean-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch and await unchanged workflow runs at exactly this PR SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo 'PR head changed before CI'; exit 1; }
          for workflow in lean-proofs.yml weighted-lean.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$PR_BRANCH"
          done
          for workflow in lean-proofs.yml weighted-lean.yml; do
            found=0
            for attempt in $(seq 1 320); do
              runs="$(gh run list --repo "$REPO" --workflow "$workflow" --branch "$PR_BRANCH" --event workflow_dispatch --limit 50 --json databaseId,headSha,status,conclusion)"
              match="$(printf '%s' "$runs" | jq -c --arg sha "$PR_SHA" '[.[] | select(.headSha == $sha)] | first // empty')"
              if [[ -n "$match" ]]; then
                run_id="$(printf '%s' "$match" | jq -r .databaseId)"
                status="$(printf '%s' "$match" | jq -r .status)"
                conclusion="$(printf '%s' "$match" | jq -r .conclusion)"
                if [[ "$status" == completed ]]; then
                  echo "$workflow at $PR_SHA: $conclusion (run $run_id)"
                  [[ "$conclusion" == success ]] || { gh run view "$run_id" --repo "$REPO" || true; exit 1; }
                  found=1
                  break
                fi
              fi
              sleep 15
            done
            [[ "$found" == 1 ]] || { echo "$workflow lacks exact-SHA success"; exit 1; }
          done
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo 'PR head moved during CI'; exit 1; }

name: Finite primitive-tip strict marked-Wave gain

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/independent_audits/tip_family_finite_p_wave_gain_20261116/**'
      - '.github/workflows/tip-family-finite-p-wave-gain.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  pull_request:
    paths:
      - 'research/independent_audits/tip_family_finite_p_wave_gain_20261116/**'
      - '.github/workflows/tip-family-finite-p-wave-gain.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-wave-certificate:
    name: Finite physical segments, source metric savings and hostile tests
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce strictly add-only source boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The add-only scope is the initial package-creation contract.
          # Maintenance must retain all mathematical and exact-head checks.
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:research/independent_audits/tip_family_finite_p_wave_gain_20261116" 2>/dev/null; then
            echo "Existing package at exact PR base; running maintenance checks"
            exit 0
          fi
          while IFS=$'\t' read -r status path; do
            [[ "$status" == A ]] || { echo "Not add-only: $status $path"; exit 1; }
            case "$path" in
              research/independent_audits/tip_family_finite_p_wave_gain_20261116/*|.github/workflows/tip-family-finite-p-wave-gain.yml) ;;
              *) echo "Out-of-scope file $path"; exit 1 ;;
            esac
          done < <(git diff --name-status "$BASE_SHA...HEAD")
      - name: Exact Python syntax without bytecode
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          d=Path('research/independent_audits/tip_family_finite_p_wave_gain_20261116')
          for f in (d/'verify.py',d/'test_verify.py'):
              ast.parse(f.read_text(), filename=str(f))
          assert (d/'NOTE.md').is_file()
          PY
      - name: New 10-period exact interval verification, all-period theorem
        run: python -B research/independent_audits/tip_family_finite_p_wave_gain_20261116/verify.py
      - name: Hostile geometry and reciprocal mutation tests
        run: python -B -m unittest discover -s research/independent_audits/tip_family_finite_p_wave_gain_20261116 -p 'test_*.py' -v
      - name: Re-execute unchanged limiting Wave gain certificate
        run: python -B research/independent_audits/tip_family_limiting_wave_gain_20261116/verify.py
      - name: Re-execute unchanged canonical Wave gain certificate
        run: python -B research/independent_audits/tip_family_canonical_wave_gain_20261116/verify.py
      - name: Assert no modified or generated files
        run: |
          set -euo pipefail
          git diff --exit-code -- research/independent_audits/tip_family_depth_uniform_qc_20261116 research/independent_audits/crest_transport_limit_proof_20261116
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo "Unexpected artifact or predecessor modification"
            exit 1
          fi

  original-research-validation-and-weighted-lean:
    name: Require Research validation and weighted Lean at exact PR head
    needs: finite-wave-certificate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-head reuse, cancellation replacement and failure semantics
        run: python -B -m unittest discover -s code -p 'test_require_exact_head_workflows.py' -v
      - name: Require both original workflows at the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -B code/require_exact_head_workflows.py --attempts 360

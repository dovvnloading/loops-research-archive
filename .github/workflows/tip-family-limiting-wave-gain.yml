name: Limiting primitive-tip strict marked-Wave gain

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/independent_audits/tip_family_limiting_wave_gain_20261116/**'
      - '.github/workflows/tip-family-limiting-wave-gain.yml'
  pull_request:
    paths:
      - 'research/independent_audits/tip_family_limiting_wave_gain_20261116/**'
      - '.github/workflows/tip-family-limiting-wave-gain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  limiting-wave-gain-certificate:
    name: New bounded parent Wave, all-p boxes, and hostile tests
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only add files inside this audit and its own workflow
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r status path; do
            [[ "$status" == A ]] || { echo "Not add-only: $status $path"; exit 1; }
            case "$path" in
              research/independent_audits/tip_family_limiting_wave_gain_20261116/*|.github/workflows/tip-family-limiting-wave-gain.yml) ;;
              *) echo "Out-of-scope file $path"; exit 1 ;;
            esac
          done < <(git diff --name-status "origin/${{ github.event.pull_request.base.ref }}...HEAD")
      - name: Exact Python syntax and source scope
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          base=Path('research/independent_audits/tip_family_limiting_wave_gain_20261116')
          for f in (base/'verify.py', base/'test_verify.py'):
              ast.parse(f.read_text(), filename=str(f))
          assert (base/'NOTE.md').is_file()
          print("New source syntax PASS")
          PY
      - name: Certify limiting and all-p strict defect arithmetic
        run: python -B research/independent_audits/tip_family_limiting_wave_gain_20261116/verify.py
      - name: Hostile cross-ratio, deck seam and reciprocal tests
        run: python -B -m unittest discover -s research/independent_audits/tip_family_limiting_wave_gain_20261116 -p 'test_*.py' -v
      - name: Re-run original canonical-gain verifier without rewriting its evidence
        run: python -B research/independent_audits/tip_family_canonical_wave_gain_20261116/verify.py
      - name: Verify unchanged working tree and forbidden research boundaries
        run: |
          set -euo pipefail
          git diff --exit-code -- research/independent_audits/crest_transport_limit_proof_20261116 research/independent_audits/tip_family_all_depths_20261116 research/tip_family_theorem
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo "Unexpected output or modified upstream artifacts"
            exit 1
          fi

  research-and-lean-at-pr-head:
    name: Require original research validation and weighted Lean at exact SHA
    needs: limiting-wave-gain-certificate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch original workflows and require head-SHA-matched success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo "PR head moved"; exit 1; }
          for wf in lean-proofs.yml weighted-lean.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$PR_BRANCH"
          done
          for wf in lean-proofs.yml weighted-lean.yml; do
            success=0
            for attempt in $(seq 1 360); do
              runs="$(gh run list --repo "$REPO" --workflow "$wf" --branch "$PR_BRANCH" --event workflow_dispatch --limit 50 --json databaseId,headSha,status,conclusion)"
              match="$(printf '%s' "$runs" | jq -c --arg sha "$PR_SHA" '[.[] | select(.headSha == $sha)] | first // empty')"
              if [[ -n "$match" ]]; then
                rid="$(printf '%s' "$match" | jq -r .databaseId)"
                status="$(printf '%s' "$match" | jq -r .status)"
                conclusion="$(printf '%s' "$match" | jq -r .conclusion)"
                if [[ "$status" == completed ]]; then
                  echo "$wf at $PR_SHA: $conclusion (run $rid)"
                  [[ "$conclusion" == success ]] || { gh run view "$rid" --repo "$REPO" || true; exit 1; }
                  success=1
                  break
                fi
              fi
              sleep 15
            done
            [[ "$success" == 1 ]] || { echo "$wf did not pass on PR head"; exit 1; }
          done
          current="$(gh api "repos/$REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha')"
          [[ "$current" == "$PR_SHA" ]] || { echo "PR head changed during CI"; exit 1; }

name: "Real primitive-tip preprint: PDF, exact audits and original Lean"

on:
  push:
    branches: [main]
    paths:
      - 'papers/tip_family_preprint_20261116/**'
      - '.github/workflows/tip-family-preprint-20261116.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  pull_request:
    paths:
      - 'papers/tip_family_preprint_20261116/**'
      - '.github/workflows/tip-family-preprint-20261116.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tip-preprint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  latex:
    name: "Compile self-contained LaTeX preprint and upload PDF"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: "Enforce strictly add-only diff for this paper"
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The add-only scope is the initial package-creation contract.
          # Maintenance must retain all mathematical and exact-head checks.
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:papers/tip_family_preprint_20261116" 2>/dev/null; then
            echo "Existing package at exact PR base; running maintenance checks"
            exit 0
          fi
          while IFS=$'\t' read -r status path; do
            [[ "$status" == A ]] || { echo "Not add-only: $status $path"; exit 1; }
            case "$path" in
              papers/tip_family_preprint_20261116/*|.github/workflows/tip-family-preprint-20261116.yml) ;;
              *) echo "Out-of-scope changed file: $path"; exit 1 ;;
            esac
          done < <(git diff --name-status "$BASE_SHA...HEAD")
      - name: "Install plain pdflatex, bibtex and LaTeX packages"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: "Compile PDF three times with BibTeX"
        run: bash papers/tip_family_preprint_20261116/build.sh
      - name: "Verify generated PDF is nonempty"
        run: test -s papers/tip_family_preprint_20261116/main.pdf
      - name: "Upload final PDF"
        uses: actions/upload-artifact@v4
        with:
          name: tip-family-preprint-20261116-pdf
          path: papers/tip_family_preprint_20261116/main.pdf
          if-no-files-found: error

  theorem-chain:
    name: "Recheck full merged tip-family theorem chain and hostile tests"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Merged theorem chain"
        run: python -B research/tip_family_theorem/verify_chain.py
      - name: "Theorem-chain hostile tests"
        run: python -B -m unittest discover -s research/tip_family_theorem -p 'test_*.py' -v
      - name: "Assert verifier is source read-only"
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  audits:
    name: "Independent exact verifier and tests — ${{ matrix.audit }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        audit:
          - real_primitive_tip_family_uniform
          - real_primitive_tip_family_unconditional
          - real_primitive_tip_family_all_p
          - real_primitive_tip_family_prime_end_identification
          - real_primitive_tip_family_canonical_width
          - real_primitive_tip_family_canonical_width_sandwich
          - tip_family_canonical_wave_gain
          - tip_family_limiting_wave_gain
          - tip_family_finite_p_wave_gain
          - tip_family_hypothesis_M_discharge
          - tip_family_buffered_wad
          - tip_family_renormalization_depth
          - tip_family_all_depths
          - tip_family_depth_uniform_qc
          - tip_family_global_marked_qc
          - crest_transport_tip_family
          - crest_transport_asymptotics
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AUDIT: ${{ matrix.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Re-execute independently merged exact verifier"
        run: |
          set -euo pipefail
          python -B "research/independent_audits/${AUDIT}_20261116/verify.py"
      - name: "Rerun adversarial unit tests"
        run: |
          python -B -m unittest discover \
             -s "research/independent_audits/${AUDIT}_20261116" -p 'test_*.py' -v
      - name: "Check exact verifier changed no files"
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  native-sources:
    name: "Recheck native Wave p3/p4 source locks"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "p3 source-locked nonwriting regeneration"
        run: python -B research/native_wave_transfer/regenerate.py --check
      - name: "p4 source-locked nonwriting regeneration"
        run: python -B research/native_wave_transfer/regenerate_period4.py --check
      - name: "No research source mutation"
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  existing-research-and-lean:
    name: "Require unchanged Research validation and weighted Lean at exact PR head"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [latex, theorem-chain, audits, native-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-head reuse, cancellation replacement and failure semantics
        run: python -B -m unittest discover -s code -p 'test_require_exact_head_workflows.py' -v
      - name: Require both original workflows at the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -B code/require_exact_head_workflows.py --attempts 400

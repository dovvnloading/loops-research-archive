name: Tip family theorem and hostile dependency chain

on:
  push:
    branches: [main]
    paths:
      - 'research/tip_family_theorem/**'
      - '.github/workflows/tip-family-theorem-chain.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  pull_request:
    paths:
      - 'research/tip_family_theorem/**'
      - '.github/workflows/tip-family-theorem-chain.yml'
      - 'code/require_exact_head_workflows.py'
      - 'code/test_require_exact_head_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theorem-read-only-chain:
    name: Complete upstream chain, locked packets, and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert no tracked bytecode, compile new verifier and its tests
        run: |
          set -euo pipefail
          if git ls-files research/tip_family_theorem | grep -E '(__pycache__|\.pyc$)'; then
            echo 'No generated Python bytecode may be committed'
            exit 1
          fi
          python -B -m py_compile research/tip_family_theorem/verify_chain.py research/tip_family_theorem/test_verify_chain.py
      - name: Run adversarial theorem-specific tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/tip_family_theorem -p 'test_*.py' -v
      - name: Run every dependency verifier and upstream adversarial tests read-only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/tip_family_theorem/verify_chain.py --with-tests
      - name: Re-check cross-file structural claims independently
        run: python -B research/tip_family_theorem/verify_chain.py --consistency-only
      - name: Reject unexpected changes to existing tracked files
        run: |
          set -euo pipefail
          git diff --exit-code -- research/native_wave_transfer research/independent_audits results
          if git status --porcelain --untracked-files=all | grep -E '^(\?\?|[ MADRCU?!]{2}) (research/native_wave_transfer/|research/independent_audits/|results/)'; then
            echo 'An upstream verification task created or modified research data'
            exit 1
          fi

  existing-lean-discrete:
    name: Existing Lean kernel and three finite tip-family shadows
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reject Lean proof placeholders in source finite shadows
        run: |
          set -euo pipefail
          for file in \
            research/independent_audits/real_primitive_tip_family_uniform_20261116/RealPrimitiveTipDiscrete.lean \
            research/independent_audits/real_primitive_tip_family_unconditional_20261116/RealPrimitiveTipUnconditionalDiscrete.lean \
            research/independent_audits/real_primitive_tip_family_prime_end_identification_20261116/RealPrimitiveTipPrimeEndDiscrete.lean; do
            if grep -En '(^|[^A-Za-z_])(sorry|admit|axiom|unsafe)([^A-Za-z_]|$)' "$file"; then
              echo "No placeholders or custom axioms: $file"
              exit 1
            fi
          done
      - uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Kernel-check finite uniform combinatorial template
        run: lake env lean research/independent_audits/real_primitive_tip_family_uniform_20261116/RealPrimitiveTipDiscrete.lean
      - name: Kernel-check corrected 3/3/7 and 3/3/5 source arc lengths
        run: lake env lean research/independent_audits/real_primitive_tip_family_unconditional_20261116/RealPrimitiveTipUnconditionalDiscrete.lean
      - name: Kernel-check prime-end marking's finite shadow
        run: lake env lean research/independent_audits/real_primitive_tip_family_prime_end_identification_20261116/RealPrimitiveTipPrimeEndDiscrete.lean
      - name: Rebuild unchanged native KKL and proper restriction targets
        run: lake build TipKKLTreeMarking TipNativeProperRestriction

  require-original-research-and-weighted-lean:
    name: Require original Research validation and weighted Lean at exact PR SHA
    needs: [theorem-read-only-chain, existing-lean-discrete]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-head reuse, cancellation replacement and failure semantics
        run: python -B -m unittest discover -s code -p 'test_require_exact_head_workflows.py' -v
      - name: Require both original workflows at the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -B code/require_exact_head_workflows.py --attempts 320

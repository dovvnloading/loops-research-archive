name: Tip ramified precritical pair exact certificate

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - '.github/workflows/tip-ramified-precritical-pair.yml'
      - 'research/independent_audits/period9_tip_ramified_precritical_pair_20261107.md'
      - 'research/independent_audits/verify_tip_ramified_precritical_pair.py'
      - 'results/tip_ramified_precritical_pair_20261107.json'
  pull_request:
    paths:
      - '.github/workflows/tip-ramified-precritical-pair.yml'
      - 'research/independent_audits/period9_tip_ramified_precritical_pair_20261107.md'
      - 'research/independent_audits/verify_tip_ramified_precritical_pair.py'
      - 'results/tip_ramified_precritical_pair_20261107.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-local-braid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute strict integer certificates and precritical orbit diagnostics
        run: |
          python -m py_compile research/independent_audits/verify_tip_ramified_precritical_pair.py
          python research/independent_audits/verify_tip_ramified_precritical_pair.py --check-manifest

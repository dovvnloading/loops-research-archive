name: Weighted spectral mathlib proofs

concurrency:
  group: weighted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'formalization/weighted/**'
      - '*.lean'
      - '.github/workflows/weighted-lean.yml'
  pull_request:
    paths:
      - 'formalization/weighted/**'
      - '*.lean'
      - '.github/workflows/weighted-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathlib-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require each weighted Lean module in default Lake targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          d = tomllib.loads(Path("formalization/weighted/lakefile.toml").read_text())
          sources = {p.stem for p in Path("formalization/weighted").glob("*.lean")}
          declared = {entry["name"] for entry in d["lean_lib"]}
          defaults = set(d["defaultTargets"])
          missing_declared = sorted(sources - declared)
          missing_default = sorted(sources - defaults)
          if missing_declared or missing_default:
              raise SystemExit(
                  f"Unregistered Lean sources: {missing_declared}; "
                  f"omitted from Lake default targets: {missing_default}"
              )
          print(f"Every one of {len(sources)} weighted Lean files is a Lake default target.")
          PY
      - name: Reject proof holes or added axioms
        run: |
          if grep -En '(^|[^A-Za-z_])(sorry|admit|axiom)([^A-Za-z_]|$)' formalization/weighted/*.lean; then
            echo 'Proof placeholders and custom axioms are prohibited'
            exit 1
          fi
      - name: Build mathlib-backed return theorem
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization/weighted
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'true'
          use-mathlib-cache: 'true'

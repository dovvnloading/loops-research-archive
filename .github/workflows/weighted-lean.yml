name: Weighted spectral mathlib proofs

concurrency:
  group: weighted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - '**/*.lean'
      - 'formalization/weighted/lean-toolchain'
      - 'formalization/weighted/lake-manifest.json'
      - 'code/verify_lean_coverage.py'
      - 'code/verify_physical_bridge_contracts.py'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'code/verify_lean_frontier_sync.py'
      - 'formalization/weighted/**'
      - '*.lean'
      - '.github/workflows/weighted-lean.yml'
  pull_request:
    paths:
      - '**/*.lean'
      - 'formalization/weighted/lean-toolchain'
      - 'formalization/weighted/lake-manifest.json'
      - 'code/verify_lean_coverage.py'
      - 'code/verify_physical_bridge_contracts.py'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'code/verify_lean_frontier_sync.py'
      - 'formalization/weighted/**'
      - '*.lean'
      - '.github/workflows/weighted-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathlib-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete Lean source coverage and reject proof trust escapes
        run: python3 -B code/verify_lean_coverage.py
      - name: Build mathlib-backed return theorem
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization/weighted
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'true'
          use-mathlib-cache: 'true'
      - name: Audit transitive axioms of every weighted Lean declaration
        run: python3 -B code/verify_lean_coverage.py --audit weighted

name: Whole-boundary response calibration
on:
  push:
    branches: [agent/whole-boundary-response-20261126]
  pull_request:
    paths:
      - 'research/independent_audits/whole-boundary-response_20261126/**'
      - '.github/workflows/whole-boundary-response-20261126.yml'
      - 'formalization/physical_bridge_sources.tsv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  response:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      # Standard library only; no third-party packages to install.
      - name: Exact arithmetic regressions
        run: python -B research/independent_audits/whole-boundary-response_20261126/check_response.py
      - name: Check physical bridge wiring
        run: python -B code/verify_physical_bridges.py

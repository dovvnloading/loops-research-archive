<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 465" role="img" aria-labelledby="ttl desc">
<title id="ttl">Two quadratic-like target disks drawn at the exact scale ratio 8 to 1</title>
<desc id="desc">Concentric complex-plane circles centered at zero: outer target U3 has radius one quarter and inner target U9 has radius one thirty-second. The outer drawn radius is eight times the inner drawn radius. Only target disks, not their preimage domains, are represented.</desc>

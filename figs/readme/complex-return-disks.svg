<text x="637" y="66" font-size="11" letter-spacing="1.6">OUTER TARGET</text>
<text x="637" y="98" font-size="25" font-family="Georgia,serif">U₃ = D(0, ¼)</text>
<text x="637" y="119" font-size="12" fill="#697368">f³ : V₃ → U₃ · degree 2</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Certified finite period-27 quadratic and its nested period-3 and period-9 returns</title>
  <desc id="diagram-desc">One real period-27 superattracting quadratic feeds an outer degree-two polynomial-like period-3 return and an inner degree-two period-9 return. The respective critical return periods are 9 and 3. Inner little filled Julia set K9 is contained in K3, with nine physical phase windows projecting to three. These finite returns are not a proof of MLC.</desc>
  <rect width="980" height="330" rx="18" fill="#f8fafc"/>
  <text x="44" y="43" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">A concrete two-scale dynamical testbed</text>
  <text x="44" y="69" font-family="Arial,sans-serif" font-size="14" fill="#475569">Theoretical geometry is established using exact interval bounds and classical complex-analysis arguments.</text>
  <g font-family="Arial,sans-serif">
    <rect x="38" y="96" width="278" height="148" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="38" y="96" width="278" height="35" rx="12" fill="#334155"/>
    <rect x="38" y="116" width="278" height="15" fill="#334155"/>
    <text x="177" y="119" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">EXACT CENTER</text>
    <text x="177" y="165" fill="#0f172a" font-size="25" font-weight="700" text-anchor="middle">f(z) = z² + c*</text>
    <text x="177" y="193" fill="#475569" font-size="15" text-anchor="middle">Critical period: 27</text>
    <text x="177" y="217" fill="#475569" font-size="13" text-anchor="middle">Unique dyadic-bracket root</text>
    <path d="M322 170 H340" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M336 165 L343 170 L336 175" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
    <rect x="350" y="96" width="278" height="148" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="350" y="96" width="278" height="35" rx="12" fill="#0f766e"/>
    <rect x="350" y="116" width="278" height="15" fill="#0f766e"/>
    <text x="489" y="119" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">OUTER RETURN</text>
    <text x="489" y="165" fill="#0f172a" font-size="27" font-weight="700" text-anchor="middle">f³ : V₃ → U₃</text>
    <text x="489" y="193" fill="#475569" font-size="15" text-anchor="middle">Degree 2 · critical period 9</text>
    <text x="489" y="217" fill="#475569" font-size="13" text-anchor="middle">Target radius: 1/4</text>
    <path d="M634 170 H652" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M648 165 L655 170 L648 175" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
    <rect x="662" y="96" width="278" height="148" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="662" y="96" width="278" height="35" rx="12" fill="#0369a1"/>
    <rect x="662" y="116" width="278" height="15" fill="#0369a1"/>
    <text x="801" y="119" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">INNER RETURN</text>
    <text x="801" y="165" fill="#0f172a" font-size="27" font-weight="700" text-anchor="middle">f⁹ : V₉ → U₉</text>
    <text x="801" y="193" fill="#475569" font-size="15" text-anchor="middle">Degree 2 · critical period 3</text>
    <text x="801" y="217" fill="#475569" font-size="13" text-anchor="middle">Target radius: 1/32</text>
    <rect x="38" y="262" width="902" height="42" rx="8" fill="#e2e8f0"/>
    <text x="489" y="288" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">K₉ ⊂ K₃  ·  phase map j mod 9 → j mod 3  ·  |c − c*| &lt; 2⁻³²</text>
  </g>
  <text x="489" y="321" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Schematic summary of a finite attracting-window model; not a Kahn–Lyubich marked atlas or MLC theorem.</text>
</svg>

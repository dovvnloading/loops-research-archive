name = "loops_weighted"
version = "0.1.0"
defaultTargets = ["WeightedReturn", "GraphWeightedBridge", "CloneBounds", "CloneRoot", "FullCloneEigen", "FullCloneMatrix", "SpectralDominance", "FullCloneSpectralMax", "Period27RealCenter", "Period27RealUniqueness", "Period27RealExactPeriod"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "WeightedReturn"

# Import the already kernel-checked graph modules from the repository root.
# srcDir is relative to this nested package and contains no file copies.

[[lean_lib]]
name = "LoopsFormal"
srcDir = "../.."

[[lean_lib]]
name = "CloneGraph"
srcDir = "../.."

[[lean_lib]]
name = "FirstReturn"
srcDir = "../.."

[[lean_lib]]
name = "ReturnBlocks"
srcDir = "../.."

[[lean_lib]]
name = "ReturnPaths"
srcDir = "../.."

[[lean_lib]]
name = "GraphWeightedBridge"

[[lean_lib]]
name = "CloneBounds"

[[lean_lib]]
name = "CloneRoot"

[[lean_lib]]
name = "FullCloneEigen"

[[lean_lib]]
name = "FullCloneMatrix"

[[lean_lib]]
name = "SpectralDominance"

[[lean_lib]]
name = "FullCloneSpectralMax"

# Import the core Lean verified exact integer/rational orbit certificates.
[[lean_lib]]
name = "Period27Kneading"
srcDir = "../.."

[[lean_lib]]
name = "Period27Dyadic"
srcDir = "../.."

[[lean_lib]]
name = "Period27IntervalSound"
srcDir = "../.."

[[lean_lib]]
name = "Period27RationalTrace"
srcDir = "../.."

[[lean_lib]]
name = "Period27RationalDerivative"
srcDir = "../.."

[[lean_lib]]
name = "Period27RealCenter"

[[lean_lib]]
name = "Period27RealUniqueness"

[[lean_lib]]
name = "Period27RealExactPeriod"

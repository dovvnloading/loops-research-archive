[[lean_lib]]
name = "ReturnPaths"
srcDir = "../.."

[[lean_lib]]
name = "GraphWeightedBridge"

[[lean_lib]]
name = "CloneBounds"

[[lean_lib]]
name = "CloneRoot"

[[lean_lib]]
name = "FullCloneEigen"

[[lean_lib]]
name = "FullCloneMatrix"

[[lean_lib]]
name = "NativeWaveGate"

[[lean_lib]]
name = "LimbInsertionHolonomy"

[[lean_lib]]
name = "AtomCutDefect"

[[lean_lib]]
name = "SpectralDominance"

